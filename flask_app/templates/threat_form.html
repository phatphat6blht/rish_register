{% extends 'base.html' %}

{% block title %}{{ 'Edit Threat' if threat else 'New Threat' }} | Cyber Risk Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-virus text-warning me-2"></i>{{ 'Edit Threat' if threat else 'Add New Threat' }}</h2>
            <a href="{{ url_for('threats') }}" class="btn btn-cyber-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back</a>
        </div>

        <div class="card p-3 p-md-4">
            <div class="card-body">
                <form method="POST" action="{{ url_for('update_threat', id=threat.id) if threat else url_for('create_threat') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Threat Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ threat.name if threat else '' }}" required placeholder="e.g. Ransomware Attack">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="Malware" {% if threat and threat.category == 'Malware' %}selected{% endif %}>Malware</option>
                            <option value="Social Engineering" {% if threat and threat.category == 'Social Engineering' %}selected{% endif %}>Social Engineering</option>
                            <option value="Network Attack" {% if threat and threat.category == 'Network Attack' %}selected{% endif %}>Network Attack</option>
                            <option value="Insider Threat" {% if threat and threat.category == 'Insider Threat' %}selected{% endif %}>Insider Threat</option>
                            <option value="Physical" {% if threat and threat.category == 'Physical' %}selected{% endif %}>Physical</option>
                            <option value="Natural Disaster" {% if threat and threat.category == 'Natural Disaster' %}selected{% endif %}>Natural Disaster</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Description of the threat vector...">{{ threat.description if threat else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('threats') }}" class="btn btn-cyber-secondary">Cancel</a>
                        <button type="submit" class="btn btn-cyber-primary px-4"><i class="bi bi-check-circle me-1"></i> Save Threat</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
