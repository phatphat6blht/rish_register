{% extends 'base.html' %}

{% block title %}{{ 'Edit Asset' if asset else 'New Asset' }}{% endblock %}

{% block content %}
<h2>{{ 'Edit Asset' if asset else 'New Asset' }}</h2>

<div class="card mt-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('update_asset', id=asset.id) if asset else url_for('create_asset') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Asset Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ asset.name if asset else '' }}" required>
            </div>
            
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="asset_type" class="form-label">Asset Type</label>
                    <input type="text" class="form-control" id="asset_type" name="asset_type" value="{{ asset.asset_type if asset else '' }}" placeholder="e.g. Server, Application" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="owner" class="form-label">Owner</label>
                    <input type="text" class="form-control" id="owner" name="owner" value="{{ asset.owner if asset else '' }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="criticality" class="form-label">Criticality (1-5)</label>
                    <input type="number" class="form-control" id="criticality" name="criticality" min="1" max="5" value="{{ asset.criticality if asset else 1 }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ asset.description if asset else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Asset</button>
            <a href="{{ url_for('assets') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
